# =============================================================================
# ANTRIAN INBOUND FROZEN — STACK PRODUKSI
#
# Dua layanan:
#
#   db   Postgres  — data operasional
#   app  Node      — berkas statis, API, dan penjadwal sync dalam satu proses
#
# Semuanya sumber terbuka tanpa tier berbayar, berjalan di server Anda sendiri.
# Postgres berada di host yang sama dengan aplikasi, jadi setiap kueri adalah
# panggilan lokal — dan tidak ada proyek yang ditangguhkan setelah tujuh hari
# sepi.
#
# Di Coolify: build pack "Docker Compose", berkas ini.
# Alternatifnya, build pack "Dockerfile" juga cukup bila Postgres disediakan
# terpisah sebagai resource Coolify; aplikasi hanya perlu DATABASE_URL.
# =============================================================================

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-inbound}
      POSTGRES_USER: ${POSTGRES_USER:-inbound}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diisi}
      TZ: Asia/Jakarta
    volumes:
      - inbound-db:/var/lib/postgresql/data
    healthcheck:
      # `app` menunggu ini sebelum start, sehingga penerapan skema tidak pernah
      # berlomba dengan Postgres yang belum siap menerima koneksi.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-inbound} -d ${POSTGRES_DB:-inbound}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-inbound}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-inbound}
      PORT: 3000
      TZ: Asia/Jakarta

      # Akun aplikasi dan kunci penanda tangan sesi. Keduanya wajib; tanpa
      # nilai, compose menolak start alih-alih menyalakan aplikasi yang setiap
      # login-nya pasti gagal.
      INBOUND_AUTH_USERS: ${INBOUND_AUTH_USERS:?INBOUND_AUTH_USERS wajib diisi}
      INBOUND_AUTH_SECRET: ${INBOUND_AUTH_SECRET:?INBOUND_AUTH_SECRET wajib diisi}

      # Sumber master PO. Bila cookie kosong, sync mati dan aplikasi tetap
      # berjalan penuh — pendaftaran cukup memakai opsi PO manual.
      SUPERSET_BASE_URL: ${SUPERSET_BASE_URL:-https://dash.astronauts.id}
      SUPERSET_SESSION_COOKIE: ${SUPERSET_SESSION_COOKIE:-}
      # Id DATASET, bukan location_id — keduanya kebetulan 160 dan tidak
      # berhubungan. location_id selalu dibaca dari tabel site_master.
      SUPERSET_DATASET_ID: ${SUPERSET_DATASET_ID:-160}
      # Hanya jalur cadangan bila dataset tidak dapat dikueri langsung.
      SUPERSET_CHART_ID: ${SUPERSET_CHART_ID:-20662}
    # `expose`, bukan `ports`: proxy Coolify menjangkau layanan lewat jaringan
    # internal, dan menerbitkan port ke host justru berebut dengannya.
    expose:
      - "3000"

volumes:
  inbound-db:
