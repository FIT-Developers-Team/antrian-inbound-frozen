# =============================================================================
# Override pengembangan lokal.
#
# docker-compose.yml sengaja tidak menerbitkan port: di Coolify, proxy platform
# yang menjangkau layanan lewat jaringan internal. Di mesin sendiri tidak ada
# proxy semacam itu, jadi pemetaan port ditambahkan di sini.
#
#   npm run stack:up
# =============================================================================

services:
  app:
    ports:
      - "${WEB_PORT:-8090}:3000"

  db:
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
