<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Antrian Inbound Frozen</title>
    <meta
      name="description"
      content="Antrean inbound gudang beku: catat kedatangan, mulai bongkar, dan pantau hitung mundur SLA dalam satu papan."
    />
    <meta name="theme-color" content="#09111f" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f4f7fb" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="light dark" />

    <!-- API berada di origin yang sama, jadi tidak ada host backend yang perlu
         dihangatkan lebih dulu. Preconnect ke proyek Supabase lama masih
         terpasang lama setelah backendnya dipensiunkan: satu sambungan TLS
         penuh, dibuka pada setiap muat halaman, ke host yang tidak pernah lagi
         dihubungi. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Inconsolata:wght@400;700&display=swap"
    />

    <link rel="icon" type="image/png" href="assets/login-logo.png" />
    <link rel="apple-touch-icon" href="assets/login-logo.png" />
    <link rel="preload" as="image" href="assets/login-banner.webp" type="image/webp" />
    <link rel="stylesheet" href="style.css?v=32.0" />

    <!--
      Modul di-preload semuanya sekaligus.

      Tanpa baris-baris ini browser menemukan modul SATU TINGKAT PADA SATU
      WAKTU: ia mengunduh app.js, menguraikannya, baru tahu bahwa ia butuh
      pages/board.js; mengunduh itu, menguraikannya, baru tahu ia butuh
      queue-card.js; dan seterusnya. Grafik impor aplikasi ini dalam enam
      tingkat, jadi itu enam perjalanan pulang-pergi BERURUTAN sebelum satu
      piksel pun tergambar — di Wi-Fi gudang, hampir setengah detik yang
      dihabiskan hanya untuk menunggu giliran.

      `modulepreload` memberi tahu browser seluruh daftarnya di muka, sehingga
      keenam belas berkas diunduh bersamaan. Urutan di bawah mengikuti
      kedalaman: yang paling dalam lebih dulu, karena itu yang paling lama
      menahan sisanya.
    -->
    <link rel="modulepreload" href="js/deployment.js" />
    <link rel="modulepreload" href="js/config.js" />
    <link rel="modulepreload" href="js/format.js" />
    <link rel="modulepreload" href="js/api.js" />
    <link rel="modulepreload" href="js/sla.js" />
    <link rel="modulepreload" href="js/ui.js" />
    <link rel="modulepreload" href="js/store.js" />
    <link rel="modulepreload" href="js/theme.js" />
    <link rel="modulepreload" href="js/charts.js" />
    <link rel="modulepreload" href="js/pages/queue-card.js" />
    <link rel="modulepreload" href="js/pages/board.js" />
    <link rel="modulepreload" href="js/pages/register.js" />
    <link rel="modulepreload" href="js/pages/report.js" />
    <link rel="modulepreload" href="js/pages/analytics.js" />
    <link rel="modulepreload" href="js/pages/settings.js" />

    <script>
      /* Tema dipasang sebelum paint pertama supaya tidak ada kedipan putih di
         perangkat bertema gelap. Sengaja sebaris dan sinkron. */
      (function () {
        try {
          var mode = localStorage.getItem("inbound_frozen_theme_v2");
          if (mode === "dark") document.documentElement.classList.add("dark");
          if (mode === "light") document.documentElement.classList.add("light");
        } catch (error) {
          /* Mode penyamaran memakai preferensi sistem. */
        }
      })();
    </script>
  </head>

  <body>
    <noscript>
      <div class="noscript-banner">
        Aplikasi ini memerlukan JavaScript. Aktifkan JavaScript di browser, lalu muat ulang halaman.
      </div>
    </noscript>

    <div class="app-boot" role="status" id="initial-boot">
      <span class="spinner" aria-hidden="true"></span>
      <p>Menyiapkan Antrian Inbound Frozen…</p>
    </div>

    <script type="module" src="js/app.js?v=32.0"></script>
  </body>
</html>
